# Why this file exists
# --------------------
# The simulator models come from the submodule Tools/simulation/gz (repository
# LEVITUM-e-V/PX4-gazebo-models, branch `levitum`, see `branch` in .gitmodules). A submodule
# stores one exact commit, so a checkout of this fork always uses the models of that commit;
# that keeps simulation runs comparable. The pin on `levitum-dev` must still follow the models
# branch, otherwise nobody gets model fixes. This file makes Dependabot open a pull request
# whenever the models branch has a commit the pin does not have. The pin only moves after
# someone reviews and merges that pull request.
#
# How it works
# ------------
# - Dependabot reads this file from the default branch (`main`); `target-branch` sends the
#   update pull requests to `levitum-dev`, where the pin is maintained.
# - `allow` limits it to the gazebo models. This fork has 23 submodules (NuttX, mavlink,
#   libuavcan, ...); without the limit Dependabot would open pull requests for all of them.
# - To check it: Insights > Dependency graph > Dependabot must accept this file and list only
#   Tools/simulation/gz. If it opens pull requests for other submodules, fix or remove `allow`.
# - Without Dependabot, bump by hand on levitum-dev:
#     git submodule update --remote Tools/simulation/gz && git commit -am "Update gz models"
# - To test newer models without changing the pin, point the simulation scripts at a checkout
#   of the models (MODELS_DIR in LEVITUM-e-V/PX4_Tools, folder sim_docker).
version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    target-branch: "levitum-dev"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "Tools/simulation/gz"
    commit-message:
      prefix: "gz models"
